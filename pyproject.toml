[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsmf-reconstruct"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.59.0",
    "xhtml2pdf>=0.2.16",
]

[project.scripts]
rsmf-reconstruct = "rsmf_reconstruct.main:main"
rsmf-export-pdf = "rsmf_reconstruct.export_pdf:export_pdf_main"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
